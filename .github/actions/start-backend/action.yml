name: Start Todo API
description: Starts the bundled back-end (backend/server.mjs) in the background and waits until it is healthy.
inputs:
  port:
    description: Port to listen on
    default: "3000"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Start Todo API
      shell: bash
      env:
        PORT: ${{ inputs.port }}
      run: |
        nohup node --disable-warning=ExperimentalWarning backend/server.mjs > "$RUNNER_TEMP/backend.log" 2>&1 &
        for i in $(seq 1 30); do
          if curl -fsS "http://localhost:${PORT}/health" > /dev/null; then
            echo "Todo API is healthy on port ${PORT}"
            exit 0
          fi
          sleep 1
        done
        echo "::error::Todo API did not become healthy"
        cat "$RUNNER_TEMP/backend.log"
        exit 1
