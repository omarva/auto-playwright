name: Docker

# Builds every language image, proves it works by running the @smoke suite inside it,
# and publishes it to GitHub Container Registry from main.
on:
  push:
    branches: [main]
    paths:
      - "**/Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "typescript/package*.json"
      - "python/requirements*.txt"
      - "java/pom.xml"
      - "dotnet/**/*.csproj"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "**/Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  schedule:
    - cron: "0 5 * * 1" # weekly, Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image · ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, python, java, dotnet]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/auto-playwright-${{ matrix.language }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.language }}/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.language }}
          cache-to: type=gha,mode=max,scope=${{ matrix.language }}
      - name: Run @smoke inside the container
        run: |
          mkdir -p "reports"
          docker run --rm --ipc=host -e CI=true -e TAGS=@smoke -e PARALLEL=2 \
            -v "$PWD/reports:/app/${{ matrix.language }}/reports" \
            "$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
      - name: Upload container reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-reports-${{ matrix.language }}
          path: reports/
          retention-days: 7
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker push --all-tags "$IMAGE"
