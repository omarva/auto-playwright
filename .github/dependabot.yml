version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /typescript
    schedule: { interval: weekly }
    ignore:
      # @types/node must track the Node LTS used in CI (24), not the latest Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      playwright: { patterns: ["@playwright/*", "playwright*", "@axe-core/*"] }
      tooling:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /python
    schedule: { interval: weekly }
    groups:
      python-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /java
    schedule: { interval: weekly }
    groups:
      java-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /dotnet
    schedule: { interval: weekly }
    ignore:
      # Reqnroll.NUnit is only validated against NUnit 3/4.
      - dependency-name: NUnit
        update-types: [version-update:semver-major]
    groups:
      dotnet-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/typescript, /python, /java, /dotnet]
    schedule: { interval: weekly }
