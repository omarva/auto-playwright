# Cucumber JUnit Platform engine configuration.
# Tags, parallelism and the Allure results directory are injected by Maven
# (see pom.xml systemPropertyVariables) from TAGS / PARALLEL / RETRIES.
cucumber.glue=dev.autoplaywright
# The RerunSafe* plugins behave exactly like Cucumber's json/html/message/junit
# formatters, but keep the output of RETRIES re-runs in separate *.rerun-N.* files
# instead of overwriting the first execution.
cucumber.plugin=summary,\
  dev.autoplaywright.support.report.RerunSafeJsonFormatter:reports/cucumber/cucumber.json,\
  dev.autoplaywright.support.report.RerunSafeHtmlFormatter:reports/cucumber/cucumber.html,\
  dev.autoplaywright.support.report.RerunSafeMessageFormatter:reports/cucumber/messages.ndjson,\
  dev.autoplaywright.support.report.RerunSafeJUnitFormatter:reports/cucumber/cucumber-junit.xml,\
  io.qameta.allure.cucumber8jvm.AllureCucumber8Jvm
cucumber.publish.quiet=true
cucumber.snippet-type=camelcase
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=2
cucumber.execution.parallel.config.fixed.max-pool-size=2
cucumber.junit-platform.naming-strategy=long
